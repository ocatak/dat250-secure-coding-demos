# DAT250 Secure Coding - the lecture's checks run on every push and pull request.
# Pin third-party actions to a full commit SHA in real projects (tags shown for readability).
name: secure-coding
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }               # full history, so gitleaks sees old commits
      - uses: actions/setup-python@v7.0.0
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          pip install flask pyyaml argon2-cffi pytest hypothesis semgrep bandit pip-audit
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
      - name: Secrets in code (gitleaks)                  # demo 9
        run: ./gitleaks git -v .
      - name: SAST (Semgrep custom rules + Bandit)        # demo 7
        run: |
          semgrep --config semgrep-rules/dat250.yml --error --metrics=off vulnerable-app/app.py
          bandit -r vulnerable-app -ll -x vulnerable-app/tests,vulnerable-app/solutions
      - name: Security unit tests + fuzzing               # demos 1, 2
        run: |
          (cd vulnerable-app && python -m pytest -q tests)
          (cd demo-fuzzing && python -m pytest -q)
      - name: Vulnerable dependencies (pip-audit)         # demo 11
        run: pip-audit -r vulnerable-app/requirements.txt
